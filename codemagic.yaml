workflows:
  android-offline-build:
    name: Polio Route Navigator (Android Debug APK)
    max_build_duration: 30
    instance_type: mac_mini_m1
    
    environment:
      flutter: stable
      java: 17
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx8192M -XX:MaxMetaspaceSize=1024m\""
        JAVA_TOOL_OPTIONS: "-Xmx8192m"

    scripts:
      - name: Verify Environment & Java Version
        script: |
          java -version
          flutter --version

      - name: Clean Cache & Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Verify Assets Exist
        script: |
          mkdir -p assets
          if [ ! -f "assets/developer.jpg" ]; then
            touch assets/developer.jpg
          fi

      - name: Ensure Android Native Structure & Gradlew Permissions
        script: |
          chmod +x android/gradlew
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

      - name: Build Installable Android Debug APK
        script: |
          flutter build apk --debug --verbose --android-skip-build-dependency-validation

    artifacts:
      - build/**/outputs/**/*.apk
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - asifnaqwi@gmail.com
        notify:
          success: true
          failure: true
