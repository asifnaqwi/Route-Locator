# ==============================================================================
# Foolproof Codemagic Configuration for 100% Offline Polio Route Navigator
# ==============================================================================

workflows:
  android-offline-build:
    name: Polio Route Navigator (Android Debug APK)
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      java: 17
      groups: []
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
        JAVA_TOOL_OPTIONS: "-Xmx8192m"

    scripts:
      - name: Verify Environment & Java Version
        script: |
          echo "=== PIPELINE ENVIRONMENT CHECK ==="
          java -version
          flutter --version

      - name: Clean Cache & Resolve Dependencies
        script: |
          flutter clean
          flutter pub add path:^1.9.1 || true
          flutter pub get

      - name: Verify Local Assets
        script: |
          mkdir -p assets
          if [ ! -f "assets/developer.jpg" ]; then
            echo "Generating fallback placeholder for developer.jpg..."
            touch assets/developer.jpg
          fi

      - name: Ensure Android Native Structure & Permissions
        script: |
          chmod +x android/gradlew || true
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

      - name: Build Installable Android Debug APK
        script: |
          flutter build apk --debug --android-skip-build-dependency-validation --verbose

    artifacts:
      - build/**/outputs/**/*.apk
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - asifnaqwi@gmail.com
        notify:
          success: true
          failure: true
