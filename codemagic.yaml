- name: Verify Local Assets
        script: |
          mkdir -p assets
          if [ ! -f "assets/developer.jpg" ]; then
            echo "Generating fallback placeholder for developer.jpg..."
            touch assets/developer.jpg
          fi
          if [ ! -f "assets/developer.png" ]; then
            echo "Generating fallback placeholder for developer.png..."
            touch assets/developer.png
          fi
          echo "Local assets verified."
