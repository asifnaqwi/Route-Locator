# android/gradle.properties
# ==============================================================================
# Codemagic Zero-Heap-Space Memory Allocation & Modern AndroidX Flags
# ==============================================================================

# Heap allocation: Eliminates "Java heap space" out-of-memory crashes
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX enabled
android.useAndroidX=true

# DISABLE Jetifier: Modern Flutter plugins are 100% AndroidX native.
# Disabling Jetifier prevents huge memory consumption and hanging Jetify steps on Codemagic!
android.enableJetifier=false

# Enable parallel execution and Gradle build cache for speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
