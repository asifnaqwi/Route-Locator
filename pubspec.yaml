name: polio_route_navigator
description: "100% Offline Polio Route Navigator with visual map."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization Support (Urdu RTL)
  flutter_localizations:
    sdk: flutter

  # Maps and Navigation
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location Tracking
  flutter_foreground_task: ^8.1.0
  geolocator: ^12.0.0

  # Local Data & Settings Storage
  sqflite: ^2.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # File Sharing & Importing
  share_plus: ^10.1.0
  file_picker: ^8.1.2

  # Utilities
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Declare local asset images - NO network URLs are used
  assets:
    - assets/
    - assets/developer.jpg
    - assets/developer.png
