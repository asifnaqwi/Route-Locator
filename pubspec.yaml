name: polio_route_navigator
description: "100% Offline Polio Route Navigator with Kalman Filter GPS drift correction and local SQLite persistence."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Foreground task execution for reliable background GPS tracking
  flutter_foreground_task: ^8.1.0

  # Native GPS device hardware location tracking
  geolocator: ^12.0.0

  # 100% Offline SQLite database
  sqflite: ^2.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.3

  # Screen wake lock to keep display active during polio fieldwork
  wakelock_plus: ^1.2.8

  # Internationalization & DateTime formatting
  intl: ^0.19.0

  # Modern UI icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Declare local asset images - NO network URLs are used
  assets:
    - assets/
